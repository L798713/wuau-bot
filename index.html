<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WUAU PET SPA - Bot</title>
  <style>
    :root {
      --primary-blue: #2563eb;
      --primary-brown: #92400e;
      --accent-gold: #d97706;
      --light-cream: #fef9f3;
      --dark-bg: #1f2937;
      --text-dark: #1f2937;
      --text-light: #f9fafb;
      --border-light: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: linear-gradient(135deg, var(--primary-brown) 0%, #78350f 50%, var(--primary-blue) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--light-cream);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 90vh;
      max-height: 750px;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-brown) 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .header p {
      font-size: 12px;
      opacity: 0.95;
      font-style: italic;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: var(--light-cream);
    }

    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bot-message {
      justify-content: flex-start;
    }

    .bot-message .content {
      background: white;
      color: var(--text-dark);
      padding: 12px 16px;
      border-radius: 18px;
      border-left: 4px solid var(--primary-blue);
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .user-message {
      justify-content: flex-end;
    }

    .user-message .content {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-brown) 100%);
      color: white;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-right-radius: 4px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .input-area {
      padding: 15px 20px;
      border-top: 2px solid var(--border-light);
      background: white;
      display: flex;
      gap: 10px;
    }

    .input-field {
      flex: 1;
      border: 2px solid var(--border-light);
      border-radius: 25px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
      background: var(--light-cream);
      color: var(--text-dark);
    }

    .input-field:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-brown) 100%);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .options-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .option-btn {
      background: white;
      border: 2px solid var(--primary-blue);
      color: var(--primary-blue);
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
      flex: 1;
      min-width: 100px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .option-btn:hover {
      background: var(--primary-blue);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .option-btn:active {
      transform: scale(0.95);
    }

    .footer {
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dark);
      border-top: 1px solid var(--border-light);
      background: white;
      display: flex;
      justify-content: center;
      gap: 15px;
      align-items: center;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .footer-icon {
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary-blue);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-section">
        <div class="logo">🐾</div>
        <h1>WUAU PET SPA</h1>
        <p>New life for your pet</p>
      </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
      <input 
        type="text" 
        id="messageInput" 
        class="input-field" 
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >
      <button class="send-btn" id="sendBtn">➤</button>
    </div>

    <div class="footer">
      <div class="footer-item">
        <span class="footer-icon">📍</span>
        <span>3516 Drumore Dr</span>
      </div>
      <div class="footer-item">
        <span class="footer-icon">📱</span>
        <span>267-702-9312</span>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const BACKEND_URL = 'https://wuau-bot-7vya.onrender.com';
    
    let userId = localStorage.getItem('userId') || 'user_' + Date.now();
    localStorage.setItem('userId', userId);
    let isWaitingForResponse = false;

    function createMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'content';
      contentDiv.innerHTML = text.replace(/\n/g, '<br>');
      
      messageDiv.appendChild(contentDiv);
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      return messageDiv;
    }

    function createOptionsButtons(options) {
      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'options-container';
      
      options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => sendMessage(option);
        optionsContainer.appendChild(btn);
      });
      
      return optionsContainer;
    }

    async function sendMessage(text = null) {
      const message = text || messageInput.value.trim();
      
      if (!message || isWaitingForResponse) return;
      
      messageInput.value = '';
      createMessage(message, true);
      isWaitingForResponse = true;

      try {
        const response = await fetch(`${BACKEND_URL}/webhook`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            userId: userId,
            message: message
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        
        const botMessageDiv = createMessage(data.response, false);
        
        if (data.options && data.options.length > 0) {
          const optionsDiv = createOptionsButtons(data.options);
          botMessageDiv.querySelector('.content').appendChild(optionsDiv);
        }
      } catch (error) {
        console.error('Error:', error);
        createMessage('❌ Error de conexión. Por favor intenta de nuevo.', false);
      } finally {
        isWaitingForResponse = false;
        messageInput.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendMessage());
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    messageInput.focus();
    
    // Send initial greeting when page loads
    setTimeout(() => {
      console.log('Sending initial greeting...');
      sendMessage('start');
    }, 800);
  </script>
</body>
</html>
