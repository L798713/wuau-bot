<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUAU PET SPA - Bot Agendamiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 30px 30px 0 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
        }

        .option-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .option-button:active {
            transform: translateY(0);
        }

        .input-container {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            border-radius: 0 0 30px 30px;
        }

        #messageInput {
            flex: 1;
            border: 2px solid #eee;
            border-radius: 25px;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        #sendButton:hover {
            transform: scale(1.05);
        }

        #sendButton:active {
            transform: scale(0.95);
        }

        .loading {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Scroll personalizado */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕🐱 WUAU PET SPA</h1>
            <p>Bot de Agendamiento - Lesly Macías</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    ¡Hola! 👋 Soy Lesly de WUAU PET SPA 🐕🐱✂️<br><br>¿En qué te puedo ayudar?
                </div>
            </div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="O escribe aquí..." 
                autocomplete="off"
            >
            <button id="sendButton">➤</button>
        </div>
    </div>

    <script>
        const BOT_URL = 'https://wuau-bot-7vya.onrender.com/chat';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        
        let sessionId = 'user_' + Date.now();
        let esperandoRespuesta = false;

        // Enviar mensaje al presionar Enter
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !esperandoRespuesta) {
                enviarMensaje();
            }
        });

        // Enviar mensaje al clickear botón
        sendButton.addEventListener('click', () => {
            if (!esperandoRespuesta) {
                enviarMensaje();
            }
        });

        async function enviarMensaje() {
            const mensaje = messageInput.value.trim();
            
            if (!mensaje) return;

            // Mostrar mensaje del usuario
            mostrarMensaje(mensaje, 'user');
            messageInput.value = '';
            esperandoRespuesta = true;

            // Mostrar indicador de carga
            mostrarCarga();

            try {
                const respuesta = await fetch(BOT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: mensaje,
                        sender: sessionId
                    })
                });

                const data = await respuesta.json();
                
                // Eliminar indicador de carga
                eliminarCarga();

                if (data.success) {
                    // Procesar respuesta del bot
                    procesarRespuestaBot(data.response);
                } else {
                    mostrarMensaje('Error al conectar con el bot', 'bot');
                }
            } catch (error) {
                console.error('Error:', error);
                eliminarCarga();
                mostrarMensaje('Error de conexión. Intenta de nuevo.', 'bot');
            }

            esperandoRespuesta = false;
        }

        function procesarRespuestaBot(respuesta) {
            // Separar texto de opciones
            const lineas = respuesta.split('\n');
            let textoRespuesta = '';
            let opciones = [];

            for (let linea of lineas) {
                // Detectar líneas con opciones (1️⃣, 2️⃣, etc)
                if (/^[0-9]️⃣|^[1-9]\)|^[1-9]\.|^[1-9]\s/.test(linea.trim())) {
                    opciones.push(linea.trim());
                } else if (linea.trim()) {
                    textoRespuesta += linea + '\n';
                }
            }

            // Mostrar texto de respuesta
            if (textoRespuesta.trim()) {
                mostrarMensaje(textoRespuesta.trim(), 'bot');
            }

            // Mostrar opciones como botones
            if (opciones.length > 0) {
                mostrarOpciones(opciones);
            }
        }

        function mostrarMensaje(texto, tipo) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${tipo}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = texto;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            // Scroll al final
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function mostrarOpciones(opciones) {
            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'button-group';

            for (let opcion of opciones) {
                // Limpiar la opción (remover emojis de números)
                let textoLimpio = opcion
                    .replace(/^[0-9]️⃣\s*/, '') // Remover emojis de números
                    .replace(/^[1-9]\)\s*/, '')  // Remover números con paréntesis
                    .replace(/^[1-9]\.\s*/, '')  // Remover números con punto
                    .trim();

                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = textoLimpio;

                button.addEventListener('click', () => {
                    // Extraer el número de la opción original
                    const numeroMatch = opcion.match(/^[0-9]|^[1-9]/);
                    const numero = numeroMatch ? numeroMatch[0] : textoLimpio;
                    
                    // Enviar el número o el texto
                    messageInput.value = numero;
                    enviarMensaje();
                });

                buttonGroup.appendChild(button);
            }

            chatContainer.appendChild(buttonGroup);

            // Scroll al final
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function mostrarCarga() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'cargaIndicador';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content loading';
            contentDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function eliminarCarga() {
            const carga = document.getElementById('cargaIndicador');
            if (carga) {
                carga.remove();
            }
        }

        // Focus en input al cargar
        messageInput.focus();
    </script>
</body>
</html>
