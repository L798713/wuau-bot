<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUAU PET SPA - Bot Agendamiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f9f9f9;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #eee;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 4px solid #c33;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
        }

        .option-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .option-button:active {
            transform: translateY(0);
        }

        .input-container {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        #messageInput {
            flex: 1;
            border: 2px solid #eee;
            border-radius: 25px;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        #sendButton:hover {
            transform: scale(1.05);
        }

        #sendButton:active {
            transform: scale(0.95);
        }

        .loading {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .status {
            font-size: 12px;
            color: #999;
            padding: 5px 0;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕🐱 WUAU PET SPA</h1>
            <p>Bot de Agendamiento - Lesly Macías</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="status" style="text-align: center; color: #999;">Conectando con el bot...</div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="O escribe aquí..." 
                autocomplete="off"
                disabled
            >
            <button id="sendButton" disabled>➤</button>
        </div>
    </div>

    <script>
        const BOT_URL = 'https://wuau-bot-7vya.onrender.com/chat';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        
        let sessionId = 'user_' + Date.now();
        let botListo = false;
        let esperandoRespuesta = false;

        // Verificar conexión con bot al cargar
        async function verificarBot() {
            try {
                console.log('Verificando bot en:', BOT_URL);
                const respuesta = await fetch(BOT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'hola',
                        sender: sessionId
                    })
                });

                if (respuesta.ok) {
                    botListo = true;
                    mostrarMensajeBot('¡Bot conectado! Escribe "agendar" para comenzar o elige una opción.');
                    mostrarOpciones(['1️⃣ Agendar cita', '2️⃣ Ver precios', '3️⃣ Conocer servicios']);
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                } else {
                    throw new Error('Bot no respondió correctamente');
                }
            } catch (error) {
                console.error('Error:', error);
                chatContainer.innerHTML = '';
                mostrarError('⚠️ No se pudo conectar con el bot. Asegúrate de que esté en línea.');
                mostrarError('Bot URL: ' + BOT_URL);
                mostrarMensajeBot('Si el error persiste, contacta a Lesly: 267-702-9312');
            }
        }

        // Enviar mensaje
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !esperandoRespuesta && botListo) {
                enviarMensaje();
            }
        });

        sendButton.addEventListener('click', () => {
            if (!esperandoRespuesta && botListo) {
                enviarMensaje();
            }
        });

        async function enviarMensaje() {
            const mensaje = messageInput.value.trim();
            
            if (!mensaje) return;

            mostrarMensajeUsuario(mensaje);
            messageInput.value = '';
            esperandoRespuesta = true;
            mostrarCarga();

            try {
                const respuesta = await fetch(BOT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: mensaje,
                        sender: sessionId
                    })
                });

                const data = await respuesta.json();
                eliminarCarga();

                if (data.success) {
                    procesarRespuestaBot(data.response);
                } else {
                    mostrarError('Error: ' + (data.error || 'Respuesta inválida'));
                }
            } catch (error) {
                console.error('Error:', error);
                eliminarCarga();
                mostrarError('Error de conexión: ' + error.message);
            }

            esperandoRespuesta = false;
        }

        function procesarRespuestaBot(respuesta) {
            const lineas = respuesta.split('\n');
            let textoRespuesta = '';
            let opciones = [];

            for (let linea of lineas) {
                if (/^[0-9]️⃣|^[1-9]\)|^[1-9]\.|^[1-9]\s/.test(linea.trim())) {
                    opciones.push(linea.trim());
                } else if (linea.trim()) {
                    textoRespuesta += linea + '\n';
                }
            }

            if (textoRespuesta.trim()) {
                mostrarMensajeBot(textoRespuesta.trim());
            }

            if (opciones.length > 0) {
                mostrarOpciones(opciones);
            }
        }

        function mostrarMensajeBot(texto) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = texto;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function mostrarMensajeUsuario(texto) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = texto;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function mostrarOpciones(opciones) {
            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'button-group';

            for (let opcion of opciones) {
                let textoLimpio = opcion
                    .replace(/^[0-9]️⃣\s*/, '')
                    .replace(/^[1-9]\)\s*/, '')
                    .replace(/^[1-9]\.\s*/, '')
                    .trim();

                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = textoLimpio;

                button.addEventListener('click', () => {
                    const numeroMatch = opcion.match(/^[0-9]|^[1-9]/);
                    const numero = numeroMatch ? numeroMatch[0] : textoLimpio;
                    
                    messageInput.value = numero;
                    enviarMensaje();
                });

                buttonGroup.appendChild(button);
            }

            chatContainer.appendChild(buttonGroup);

            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function mostrarCarga() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'cargaIndicador';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content loading';
            contentDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        function eliminarCarga() {
            const carga = document.getElementById('cargaIndicador');
            if (carga) carga.remove();
        }

        function mostrarError(texto) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = texto;
            chatContainer.appendChild(errorDiv);

            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 0);
        }

        // Iniciar verificación
        verificarBot();
    </script>
</body>
</html>
