<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUAU PET SPA - Grooming Profesional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border-left: 4px solid #4a90e2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message.user .message-content {
            background: #4a90e2;
            color: white;
            border-radius: 18px;
        }

        .input-container {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-container input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .input-container button {
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.3);
        }

        .input-container button:hover {
            background: #357abd;
            transform: scale(1.05);
        }

        .input-container button:active {
            transform: scale(0.95);
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4a90e2;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕🐱 WUAU PET SPA</h1>
            <p>Grooming para Perros y Gatos</p>
            <div class="status-badge">✓ En línea</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    ¡Hola! 👋 Bienvenido a WUAU PET SPA. ¿En qué puedo ayudarte?<br><br>
                    1️⃣ Agendar cita<br>
                    2️⃣ Ver precios
                </div>
            </div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="O escribe aquí..." 
                onkeypress="if(event.key==='Enter'){enviarMensaje()}"
            >
            <button onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <script>
        const BOT_URL = 'https://wuau-bot-7vya.onrender.com/chat';
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        let userID = 'user_' + Date.now();

        function agregarMensaje(contenido, esBot) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${esBot ? 'bot' : 'user'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = contenido;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function enviarMensaje() {
            const mensaje = userInput.value.trim();
            if (!mensaje) return;

            agregarMensaje(mensaje, false);
            userInput.value = '';

            // Mostrar indicador de carga
            agregarMensaje('Escribiendo...', true);
            const ultimoMensaje = chatContainer.lastChild;

            try {
                const response = await fetch(BOT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: mensaje,
                        sender: userID
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.status}`);
                }

                const data = await response.json();
                
                // Eliminar mensaje "Escribiendo..."
                ultimoMensaje.remove();
                
                // Agregar respuesta del bot
                if (data.response) {
                    agregarMensaje(data.response, true);
                } else {
                    agregarMensaje('Lo siento, hubo un error. Intenta de nuevo.', true);
                }
            } catch (error) {
                console.error('Error:', error);
                ultimoMensaje.remove();
                agregarMensaje('⚠️ No pude conectar con el servidor. Verifica tu conexión e intenta de nuevo.', true);
            }
        }

        // Focus en el input al cargar
        userInput.focus();
    </script>
</body>
</html>
