<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUAU PET SPA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .container { width: 100%; max-width: 480px; height: 100vh; max-height: 800px; background: white; border-radius: 24px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px 16px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.95; }
        #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #f8f9fa; }
        .msg-bot { background: white; padding: 12px 16px; border-radius: 12px; border: 1px solid #e0e0e0; font-size: 15px; line-height: 1.4; align-self: flex-start; max-width: 85%; }
        .msg-user { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 16px; border-radius: 12px; font-size: 15px; align-self: flex-end; max-width: 85%; }
        .btns { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; width: 100%; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: center; transition: all 0.2s; }
        .btn:active { transform: scale(0.98); }
        .input-area { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; background: white; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; }
        input:focus { border-color: #667eea; }
        .send { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .send:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕🐱 WUAU PET SPA</h1>
            <p>Bot de Agendamiento - Lesly Macías</p>
        </div>
        <div id="msgs"></div>
        <div class="input-area">
            <input id="inp" placeholder="O escribe aquí..." />
            <button class="send" onclick="send()">▶</button>
        </div>
    </div>

    <script>
        const URL = 'https://wuau-bot-7vya.onrender.com/chat';
        const uid = 'u' + Date.now();
        let busy = false;

        function send(texto) {
            const msg = texto || document.getElementById('inp').value.trim();
            if (!msg || busy) return;
            busy = true;
            
            addMsg('user', msg);
            document.getElementById('inp').value = '';

            fetch(URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg, sender: uid})
            })
            .then(r => r.json())
            .then(d => {
                if (d.response) {
                    addMsg('bot', d.response);
                    makeBtns(d.response);
                }
                busy = false;
            })
            .catch(e => {
                addMsg('bot', '❌ ' + e.message);
                busy = false;
            });
        }

        function addMsg(type, text) {
            const div = document.createElement('div');
            div.className = type === 'bot' ? 'msg-bot' : 'msg-user';
            div.textContent = text;
            document.getElementById('msgs').appendChild(div);
            scroll();
        }

        function makeBtns(r) {
            const resp = r.toLowerCase();
            let opciones = [];

            if (resp.includes('agendar') || resp.includes('quieres')) {
                opciones = [['Agendar cita', 'agendar'], ['Ver precios', 'precios'], ['Conocer servicios', 'servicios']];
            } 
            else if (resp.includes('perro') || resp.includes('gato')) {
                opciones = [['🐕 Perro', 'perro'], ['🐱 Gato', 'gato']];
            } 
            else if (resp.includes('tamaño')) {
                opciones = [['Mini', 'mini'], ['Pequeño', 'pequeno'], ['Mediano', 'mediano'], ['Grande', 'grande'], ['Extra Grande', 'extragrande']];
            } 
            else if (resp.includes('día') || resp.includes('lunes')) {
                opciones = [['Lunes', 'lunes'], ['Martes', 'martes'], ['Miércoles', 'miercoles'], ['Jueves', 'jueves'], ['Viernes', 'viernes'], ['Sábado', 'sabado']];
            } 
            else if (resp.includes('hora')) {
                opciones = [['8:00 AM', '8:00 AM'], ['8:30 AM', '8:30 AM'], ['9:00 AM', '9:00 AM'], ['10:00 AM', '10:00 AM'], ['11:00 AM', '11:00 AM'], ['12:00 PM', '12:00 PM'], ['1:00 PM', '1:00 PM'], ['2:00 PM', '2:00 PM'], ['3:00 PM', '3:00 PM'], ['4:00 PM', '4:00 PM']];
            } 
            else if (resp.includes('servicio')) {
                opciones = [['Baño Completo', 'baño'], ['Limpieza oídos', 'limpieza'], ['Corte uñas', 'corte']];
            } 
            else if (resp.includes('extra')) {
                opciones = [['Shampoo antipulgas', 'shampoo'], ['Desenredo', 'desenredo'], ['Ninguno', 'ninguno']];
            }

            if (opciones.length > 0) {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'btns';
                    opciones.forEach(([label, val]) => {
                        const btn = document.createElement('button');
                        btn.className = 'btn';
                        btn.textContent = label;
                        btn.onclick = () => send(val);
                        div.appendChild(btn);
                    });
                    document.getElementById('msgs').appendChild(div);
                    scroll();
                }, 50);
            }
        }

        function scroll() {
            setTimeout(() => {
                document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
            }, 0);
        }

        document.getElementById('inp').addEventListener('keypress', e => {
            if (e.key === 'Enter') send();
        });

        addMsg('bot', '¡Hola! 👋 Bienvenido a WUAU PET SPA 🐕🐱\n¿En qué puedo ayudarte hoy?');
    </script>
</body>
</html>
